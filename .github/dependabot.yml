# Keeps this site current on @dylanmerigaud/microsaas-kit without anyone remembering to look.
# The kit is released from another repo (microsaas-template) and this site consumes it from npm,
# so nothing here notices a release on its own: the pin sat 4 versions behind for two weeks.
#
# Two ecosystems are declared. The github-actions block was added alongside the first workflow
# (.github/workflows/ci.yml), as the note that used to sit here asked: before that workflow
# existed it would have had nothing to update and would have been dead config.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # `increase` rewrites the range in package.json, not just the lockfile. Without it a 0.2.x
    # patch would slip in under the existing `^0.2.1` caret with no visible diff to review.
    versioning-strategy: increase
    groups:
      # The kit gets its own group so a release lands as ONE self-contained PR, reviewable on its
      # own and never stuck behind an unrelated major somewhere else in the tree.
      microsaas-kit:
        patterns:
          - "@dylanmerigaud/microsaas-kit"
      # Everything else rides together, otherwise a quiet week still opens a dozen PRs. Groups are
      # matched in order, so this catch-all only ever sees what the group above did not take.
      dependencies:
        patterns:
          - "*"

  # The three actions used by ci.yml are pinned to a major (@v4), so this only ever proposes a
  # major bump. One grouped PR, same cadence as npm, a different commit prefix so the two streams
  # stay tellable apart in the log.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
